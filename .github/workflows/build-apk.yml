name: Build debug APK

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK with build number and commit hash
        id: rename
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(grep -m1 'versionCode' app/build.gradle.kts | grep -o '[0-9]\+')
          SHORT_SHA=$(git rev-parse --short HEAD)
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          DEST="rss-newfeed-build${BUILD_NUMBER}-${SHORT_SHA}.apk"
          mkdir -p handoff
          cp "$SRC" "handoff/$DEST"
          echo "apk_name=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.apk_name }}
          path: handoff/${{ steps.rename.outputs.apk_name }}
          retention-days: 14

      # The Actions artifact above is served from Azure Blob Storage, which the
      # Claude sandbox's egress policy also blocks (same as dl.google.com).
      # As a second, git-based handoff channel the sandbox CAN reach, also
      # commit the APK straight into the branch. "[skip ci]" stops this push
      # from re-triggering the workflow. The Claude session removes this file
      # again once it has retrieved it.
      - name: Commit APK to branch as a git-based handoff channel
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r --cached --ignore-unmatch handoff/ > /dev/null
          git add -f "handoff/${{ steps.rename.outputs.apk_name }}"
          git commit -m "Add build artifact ${{ steps.rename.outputs.apk_name }} for handoff [skip ci]"
          git push
